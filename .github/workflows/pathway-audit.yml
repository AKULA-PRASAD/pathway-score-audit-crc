name: pathway-audit tests
on:
  push:
    paths: ["tools/pathway-audit/**"]
  pull_request:
    paths: ["tools/pathway-audit/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: tools/pathway-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[survival,test]" ruff
      - run: ruff check src tests examples
      - run: pytest -q
      - run: pathway-audit demo --out demo_ci
