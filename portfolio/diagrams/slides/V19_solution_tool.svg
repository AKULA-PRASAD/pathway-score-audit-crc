   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="10.8" y="25.2" transform="rotate(-0 10.8 25.2)">1 · Replicated finding: the EMT score reads stroma</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="457.2" y="25.2" transform="rotate(-0 457.2 25.2)">2 · Delivered as a tool: pathway-audit</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="468" y="61.166572" transform="rotate(-0 468 61.166572)">1  Data-quality gate</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="630" y="60.959549" transform="rotate(-0 630 60.959549)">control gene pairs must co-express</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="468" y="97.16668" transform="rotate(-0 468 97.16668)">2  Gene drivers</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="630" y="96.959648" transform="rotate(-0 630 96.959648)">coherence, leave-one-out, stable modules</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="468" y="133.16668" transform="rotate(-0 468 133.16668)">3  Composition</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="630" y="132.959549" transform="rotate(-0 630 132.959549)">stromal / immune estimates, gene-disjoint test</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="468" y="169.166572" transform="rotate(-0 468 169.166572)">4  Genotype effects</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="630" y="168.959549" transform="rotate(-0 630 168.959549)">robust to, or explained by, MMR and composition</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="468" y="205.16668" transform="rotate(-0 468 205.16668)">5  Survival screen</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="630" y="204.959549" transform="rotate(-0 630 204.959549)">optimism-corrected gain over clinical model</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="468" y="241.166572" transform="rotate(-0 468 241.166572)">6  Single-cell sources</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="630" y="240.959549" transform="rotate(-0 630 240.959549)">which cell types supply a set's transcripts</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="457.2" y="272.16" transform="rotate(-0 457.2 272.16)">Case studies: five bulk cohorts and one single-cell cohort</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="464.4" y="296.399648" transform="rotate(-0 464.4 296.399648)">•  EMT composition-dominated in all 4 usable cohorts</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="464.4" y="315.839549" transform="rotate(-0 464.4 315.839549)">•  GSE103479 stopped at the quality gate</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="464.4" y="335.279549" transform="rotate(-0 464.4 335.279549)">•  BRAF → p53 score explained by MMR and composition (+0.89 → +0.03 SD)</text>
   </g>
   <g id="text_19">
    <text style="font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="464.4" y="354.719549" transform="rotate(-0 464.4 354.719549)">•  TCGA: BRAF effects explained by hypermutation; TP53 → p53 score robust</text>
   </g>
   <g id="text_20">
    <text style="font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="464.4" y="374.159549" transform="rotate(-0 464.4 374.159549)">•  Survival screen on GSE39582: corrected ΔC +0.0048 (frozen +0.0043)</text>
   </g>
   <g id="text_21">
    <text style="font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="464.4" y="393.599549" transform="rotate(-0 464.4 393.599549)">•  Single cells (GSE132465): EMT transcripts mainly stromal (5.1×), epithelial 0.45×</text>
   </g>
   <g id="text_22">
    <text style="font-size: 10px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="10.8" y="417.6" transform="rotate(-0 10.8 417.6)">Post-hoc registered extensions, outcome-free; tool tested (13/13; CI passing) incl. ESTIMATE match to 1e-14. Composition values are estimates, not measured fractions.</text>
   </g>
  </g>
