   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="10.8" y="25.2" transform="rotate(-0 10.8 25.2)">1 · Replicated finding: the EMT score reads stroma</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="457.2" y="25.2" transform="rotate(-0 457.2 25.2)">2 · Delivered as a tool: pathway-audit</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="468" y="67.775962" transform="rotate(-0 468 67.775962)">1  Data-quality gate</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="630" y="67.517183" transform="rotate(-0 630 67.517183)">control gene pairs must co-express</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="468" y="110.976074" transform="rotate(-0 468 110.976074)">2  Gene drivers</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="630" y="110.717285" transform="rotate(-0 630 110.717285)">coherence, leave-one-out, stable modules</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="468" y="154.176074" transform="rotate(-0 468 154.176074)">3  Composition</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="630" y="153.917183" transform="rotate(-0 630 153.917183)">stromal / immune estimates, gene-disjoint test</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="468" y="197.375962" transform="rotate(-0 468 197.375962)">4  Genotype effects</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.5px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="630" y="197.117183" transform="rotate(-0 630 197.117183)">robust to, or explained by, MMR and composition</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="468" y="240.576074" transform="rotate(-0 468 240.576074)">5  Survival screen</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.5px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="630" y="240.317183" transform="rotate(-0 630 240.317183)">optimism-corrected gain over clinical model</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="457.2" y="277.2" transform="rotate(-0 457.2 277.2)">Case study, five colorectal cohorts</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.4px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="464.4" y="302.931406" transform="rotate(-0 464.4 302.931406)">•  EMT composition-dominated in all 4 usable cohorts</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10.4px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="464.4" y="324.531305" transform="rotate(-0 464.4 324.531305)">•  GSE103479 stopped at the quality gate</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10.4px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="464.4" y="346.131305" transform="rotate(-0 464.4 346.131305)">•  BRAF → p53 score explained by MMR and composition (+0.89 → +0.03 SD)</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10.4px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="464.4" y="367.731305" transform="rotate(-0 464.4 367.731305)">•  TCGA: BRAF effects explained by hypermutation; TP53 → p53 score robust</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10.4px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="464.4" y="389.331305" transform="rotate(-0 464.4 389.331305)">•  Survival screen on GSE39582: corrected ΔC +0.0048 (frozen +0.0043)</text>
   </g>
   <g id="text_19">
    <text style="font-size: 10px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="10.8" y="406.8" transform="rotate(-0 10.8 406.8)">Post-hoc registered extensions, outcome-free; tool tested (11/11) incl. ESTIMATE match to 1e-14. Composition values are estimates, not measured fractions.</text>
   </g>
  </g>
