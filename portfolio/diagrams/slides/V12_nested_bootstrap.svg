   </g>
   <g id="text_10">
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(10.8 351.234253)">Precision rule (pre-specified): largest endpoint Monte Carlo SE ≤ 5 % of interval width; achieved 4.2 % after topping up from 500 to 750 outer</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(10.8 363.750835)">resamples.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(10.8 384.120925)">Point estimate: full-data corrected ΔC = +0.004316. Reporting was gated on a frozen verifier (PASS 60/60); a separate re-implementation</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(10.8 397.678909)">recomputed the reported quantities from the checkpoints.</text>
