   <g id="text_20">
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 112.957672)">Mean standardised mRNA of 194 p53 target genes. Primary HR</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 125.781016)">0.995 (0.882–1.123); S-7 0.993 (0.852–1.158). Strongest MMR</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 138.604359)">association of the four scores (ε² 0.1716, exploratory); 2</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 151.359453)">sign changes under batch omission. Post-hoc: lower in</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 164.251047)">TP53-mutant tumours (-0.45 SD; also within pMMR),</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 177.077891)">replicated in GSE41258 and TCGA-COAD (rank-biserial -0.22,</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 189.897734)">-0.42).</text>
   </g>
