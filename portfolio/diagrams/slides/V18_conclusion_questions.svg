   </g>
   <g id="text_7">
    <text style="font-size: 10.6px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(102.24 171.531517)">What do these scores measure in bulk tumour</text>
    <text style="font-size: 10.6px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(102.24 183.03614)">tissue?</text>
   </g>
