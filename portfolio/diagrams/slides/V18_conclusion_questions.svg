    <text style="font-weight: 700; font-size: 8.4px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="622.8" y="23.773828" transform="rotate(-0 622.8 23.773828)">NOT TESTED / HYPOTHESIS</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: middle; fill: #52606d" x="444.24" y="70.729102" transform="rotate(-0 444.24 70.729102)">Q1</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 11.6px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(465.12 64.369242)">Are there rare or partial tumour-cell EMT states that single-cell</text>
    <text style="font-weight: 700; font-size: 11.6px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(465.12 76.994664)">RNA missed?</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="435.6" y="96.705879" transform="rotate(-0 435.6 96.705879)">How:</text>
   </g>
   <g id="text_19">
    <text style="font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(476.64 97.423415)">Spatial transcriptomics or multiplexed protein imaging (e.g.</text>
    <text style="font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(476.64 108.431745)">E-cadherin, vimentin) at the invasive front.</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="435.6" y="134.145879" transform="rotate(-0 435.6 134.145879)">Why:</text>
   </g>
   <g id="text_21">
    <text style="font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #52606d" transform="translate(476.64 134.863415)">Single cells placed EMT-set transcripts mainly in stroma, with no</text>
    <text style="font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #52606d" transform="translate(476.64 145.809589)">coherent tumour-cell programme; localised states need spatial data.</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: middle; fill: #52606d" x="444.24" y="195.289102" transform="rotate(-0 444.24 195.289102)">Q2</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 11.6px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="465.12" y="195.24184" transform="rotate(-0 465.12 195.24184)">Are the Wnt, E2F, p53 and EMT pathways actually active?</text>
   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="435.6" y="221.265879" transform="rotate(-0 435.6 221.265879)">How:</text>
   </g>
   <g id="text_25">
    <text style="font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(476.64 221.921259)">Functional or protein-level readouts: reporter assays, phospho-protein</text>
    <text style="font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(476.64 232.929589)">and target-protein measurement.</text>
   </g>
   <g id="text_26">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="435.6" y="258.705879" transform="rotate(-0 435.6 258.705879)">Why:</text>
   </g>
   <g id="text_27">
    <text style="font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="476.64" y="259.423415" transform="rotate(-0 476.64 259.423415)">Turns expression associations into evidence about pathway function.</text>
   </g>
   <g id="text_28">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: middle; fill: #52606d" x="444.24" y="319.849102" transform="rotate(-0 444.24 319.849102)">Q3</text>
   </g>
   <g id="text_29">
    <text style="font-weight: 700; font-size: 11.6px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="465.12" y="319.80184" transform="rotate(-0 465.12 319.80184)">Does any score add recurrence information in a new cohort?</text>
   </g>
   <g id="text_30">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="435.6" y="345.825879" transform="rotate(-0 435.6 345.825879)">How:</text>
   </g>
   <g id="text_31">
    <text style="font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(476.64 346.543415)">A pre-specified test in an independent stage II–III cohort with ≈337</text>
    <text style="font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(476.64 357.611511)">recurrences and documented follow-up time.</text>
   </g>
   <g id="text_32">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="435.6" y="383.265879" transform="rotate(-0 435.6 383.265879)">Why:</text>
   </g>
   <g id="text_33">
    <text style="font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #52606d" transform="translate(476.64 383.983415)">None of the 14 public cohorts assessed was eligible (largest: 124</text>
    <text style="font-size: 10.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #52606d" transform="translate(476.64 394.991745)">recurrences).</text>
   </g>
  </g>
 </g>
