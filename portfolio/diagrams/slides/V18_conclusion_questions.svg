   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10.4px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #2a78d6" x="21.6" y="69.651406" transform="rotate(-0 21.6 69.651406)">Asked</text>
   </g>
   <g id="text_3">
