   <g id="text_8">
    <text style="font-weight: 700; font-size: 10.4px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f7a4d" x="21.6" y="229.491406" transform="rotate(-0 21.6 229.491406)">Found</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.6px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(102.24 223.773876)">EMT score tracks stroma in 4 bulk and 3 single-</text>
    <text style="font-size: 10.6px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(102.24 235.276015)">cell cohorts; p53 score tracks TP53 status.</text>
   </g>
