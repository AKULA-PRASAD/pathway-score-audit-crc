" style="fill: #52606d; stroke: #52606d; stroke-width: 1.2; stroke-linecap: round"/>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 10.4px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #6650c4" x="21.6" y="282.771406" transform="rotate(-0 21.6 282.771406)">Delivered</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.6px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(102.24 277.102735)">pathway-audit, so these checks can be run before a</text>
    <text style="font-size: 10.6px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(102.24 288.54028)">score is interpreted.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 10.6px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #9fd3ff" x="25.2" y="338.263164" transform="rotate(-0 25.2 338.263164)">Take-home</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11.4px; font-family: 'Arial', 'DejaVu Sans'; fill: #ffffff" transform="translate(25.2 362.16893)">Audit bulk pathway scores for tissue composition, genotype</text>
    <text style="font-size: 11.4px; font-family: 'Arial', 'DejaVu Sans'; fill: #ffffff" transform="translate(25.2 375.007289)">confounding and data quality before reading them as</text>
    <text style="font-size: 11.4px; font-family: 'Arial', 'DejaVu Sans'; fill: #ffffff" transform="translate(25.2 387.77618)">biology or adding them to prognostic models.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 13.2px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="421.2" y="25.016016" transform="rotate(-0 421.2 25.016016)">Next scientific questions</text>
   </g>
