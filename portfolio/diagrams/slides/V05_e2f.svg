   <g id="text_17">
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 140.285672)">Mean standardised mRNA of 195 E2F target genes; coherence</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 153.109016)">0.304. Primary HR 0.906 (0.807–1.016); S-7 0.872</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 165.932359)">(0.758–1.003). Five-set model 0.862 (0.746–0.996):</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 178.687453)">sensitivity only, coincided with added collinearity, not</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 191.576422)">promoted.</text>
   </g>
