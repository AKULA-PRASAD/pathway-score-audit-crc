   <g id="text_15">
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 49.695297)">Evidence on proliferation and outcome is mixed: lower</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 62.453016)">proliferation-signature expression in relapsed primaries</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 75.276359)">(Anjomshoaa 2009), but high Ki-67 associated with poorer</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 88.099703)">survival in a meta-analysis (Luo 2019).</text>
   </g>
