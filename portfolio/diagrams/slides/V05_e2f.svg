   <g id="text_19">
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 244.605672)">Which cells are dividing, and whether proliferation causes</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 257.360766)">or protects against recurrence. The direction is not</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 270.184109)">established biology.</text>
