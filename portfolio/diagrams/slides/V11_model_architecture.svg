    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(57.61875 149.745938)">location, adjuvant chemotherapy</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #2a78d6" x="320.4" y="46.8" transform="rotate(-0 320.4 46.8)">M2 · primary</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="320.4" y="70.56" transform="rotate(-0 320.4 70.56)">M1 + four pathway scores (ridge, λ = 0.351)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(355.152187 122.790938)">Clinical block, unpenalised: age</text>
    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(355.17375 136.305)">(spline), sex, stage II/III, tumour</text>
    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(352.81875 149.745938)">location, adjuvant chemotherapy</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(351.494062 212.274844)">Molecular block, ridge-penalised:</text>
    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(359.631562 225.877031)">EMT · E2F · Wnt · p53 scores</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1baf7a" x="615.6" y="46.8" transform="rotate(-0 615.6 46.8)">Five-set model</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.5px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="615.6" y="70.56" transform="rotate(-0 615.6 70.56)">sensitivity analysis only, never promoted</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(650.352188 122.790938)">Clinical block, unpenalised: age</text>
    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(650.37375 136.305)">(spline), sex, stage II/III, tumour</text>
    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(648.01875 149.745938)">location, adjuvant chemotherapy</text>
   </g>
