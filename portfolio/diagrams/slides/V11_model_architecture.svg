   <g id="text_12">
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="10.8" y="311.500342" transform="rotate(-0 10.8 311.500342)">•  M1 is exactly M2 with the pathway coefficients set to zero: the comparison isolates the molecular block.</text>
   </g>
   <g id="text_13">
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(10.8 352.037231)">•  The clinical block is unpenalised, which keeps the comparison scale-equivariant; shrinking only the molecular block makes the</text>
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(10.8 365.642212)">gain in C conservative.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="10.8" y="390.700342" transform="rotate(-0 10.8 390.700342)">•  λ is tuned by five-fold, event-stratified cross-validation inside each training set; M1 is never re-tuned.</text>
   </g>
