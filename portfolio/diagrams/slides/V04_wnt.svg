   </g>
   <g id="text_17">
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 49.629672)">Wnt-pathway genes are genomically altered in 93 % of</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 62.453016)">colorectal cancers; APC or CTNNB1 in about 80 % (TCGA</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 75.276359)">2012). Marked WNT/MYC activation characterises CMS2</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 88.099703)">(Guinney 2015). Genomic alteration is not measured</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 101.967797)">activation.</text>
   </g>
