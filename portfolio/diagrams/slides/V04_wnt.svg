   <g id="text_21">
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 271.933672)">Pathway activation (no nuclear β-catenin or APC data). No</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 284.822641)">explanation is offered for the near-zero estimate.</text>
