    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="525.6" y="130.305586" transform="rotate(-0 525.6 130.305586)">MEASURED IN THIS STUDY</text>
   </g>
   <g id="text_19">
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 153.949672)">Mean standardised mRNA of 41 target genes. Primary HR 1.016</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 166.773016)">(0.906–1.138); S-7 1.011 (0.879–1.162). Within-set</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 179.596359)">coherence 0.041 (loosely co-expressed). 1 sign change when</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 192.419703)">single batches are omitted. Post-hoc (same data): lower in</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 205.243047)">BRAF-mutant (-0.74 SD) and CIMP+ (-0.63 SD) tumours, one</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 219.111141)">serrated axis.</text>
   </g>
