   <g id="text_4">
    <text style="font-weight: 700; font-size: 26px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #8a94a3" x="244.8" y="57.128516" transform="rotate(-0 244.8 57.128516)">2</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="244.8" y="93.881836" transform="rotate(-0 244.8 93.881836)">The question</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(244.8 126.132739)">Do four predefined tumour</text>
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(244.8 141.233569)">pathway-expression scores</text>
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(244.8 157.726001)">add recurrence-</text>
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(244.8 172.976245)">discrimination</text>
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(244.8 187.060474)">information beyond</text>
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(244.8 203.552905)">clinical variables?</text>
   </g>
