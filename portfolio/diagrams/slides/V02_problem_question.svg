   <g id="text_1">
    <text style="font-weight: 700; font-size: 26px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #8a94a3" x="25.2" y="57.128516" transform="rotate(-0 25.2 57.128516)">1</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="25.2" y="93.881836" transform="rotate(-0 25.2 93.881836)">The clinical problem</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(25.2 126.059497)">After surgery for stage</text>
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(25.2 141.664233)">II–III colon cancer, some</text>
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(25.2 156.557056)">patients recur and others</text>
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(25.2 171.810229)">do not. Stage alone sorts</text>
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(25.2 187.060474)">that risk imperfectly.</text>
   </g>
