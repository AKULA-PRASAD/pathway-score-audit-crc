   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="464.4" y="93.881836" transform="rotate(-0 464.4 93.881836)">The trap</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(464.4 125.983325)">A larger model usually</text>
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(464.4 141.382983)">fits its own patients</text>
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(464.4 156.557056)">better. That optimism</text>
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(464.4 171.734058)">makes signatures look</text>
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(464.4 186.984302)">more predictive than they</text>
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(464.4 202.317554)">are.</text>
   </g>
