   <g id="text_21">
    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="10.8" y="399.6" transform="rotate(-0 10.8 399.6)">Endpoint: cause-specific hazard of recurrence (not absolute risk). Validation: internal only.</text>
