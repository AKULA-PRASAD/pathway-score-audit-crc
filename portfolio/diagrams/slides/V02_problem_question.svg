   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="684" y="93.881836" transform="rotate(-0 684 93.881836)">The approach</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(684 127.301685)">Fix the features before</text>
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(684 141.206226)">outcomes, compare</text>
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(684 157.726001)">clinical vs clinical +</text>
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(684 171.734058)">pathways, and measure the</text>
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(684 187.060474)">gain after removing</text>
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(684 202.307788)">optimism, with its</text>
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(684 217.48479)">uncertainty.</text>
   </g>
