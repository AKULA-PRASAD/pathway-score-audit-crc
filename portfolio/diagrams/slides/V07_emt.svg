   <g id="text_12">
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 49.629672)">The mesenchymal CMS4 subtype had worse relapse-free</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 62.453016)">survival (Guinney 2015; GSE39582 contributed, so not</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 75.276359)">independent). Mesenchymal-subtype transcripts in bulk</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 88.099703)">tumours are mostly stromal (Calon 2015; Isella 2015).</text>
   </g>
