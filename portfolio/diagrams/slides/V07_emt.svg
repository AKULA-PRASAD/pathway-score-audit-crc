   <g id="text_14">
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 140.285672)">Mean standardised mRNA of 198 genes. Primary HR 1.070</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 153.109016)">(0.951–1.202), above 1 in every fit but never</text>
    <text style="font-size: 11.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2933" transform="translate(525.6 165.932359)">distinguishable from 1; S-7 1.084 (0.937–1.254). MMR</text>
